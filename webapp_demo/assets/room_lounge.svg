<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="loungeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211A16"/>
      <stop offset="50%" stop-color="#191310"/>
      <stop offset="100%" stop-color="#0E0B09"/>
    </linearGradient>
    <linearGradient id="terraceSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543A2C"/>
      <stop offset="100%" stop-color="#241B15"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#loungeBg)"/>

  <!-- High Ceiling Architectural Windows to Terrace -->
  <rect x="40" y="30" width="720" height="230" rx="12" fill="url(#terraceSky)" stroke="rgba(212,163,115,0.2)" stroke-width="2"/>
  <line x1="220" y1="30" x2="220" y2="260" stroke="rgba(224,196,172,0.18)" stroke-width="2"/>
  <line x1="400" y1="30" x2="400" y2="260" stroke="rgba(224,196,172,0.18)" stroke-width="2"/>
  <line x1="580" y1="30" x2="580" y2="260" stroke="rgba(224,196,172,0.18)" stroke-width="2"/>

  <!-- Terrace Green Plants Outside -->
  <circle cx="220" cy="220" r="35" fill="#3D4B34" opacity="0.8"/>
  <circle cx="400" cy="210" r="45" fill="#4B5E3F" opacity="0.85"/>
  <circle cx="580" cy="225" r="40" fill="#3D4B34" opacity="0.8"/>

  <!-- Barista Counter & Coffee Bar (Right Side) -->
  <rect x="560" y="240" width="180" height="150" rx="8" fill="#1C1613" stroke="#D4A373" stroke-width="2"/>
  <rect x="580" y="200" width="40" height="40" rx="4" fill="#2E231D"/>
  <text x="650" y="290" fill="#D4A373" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">☕ BARRA BARISTA</text>
  <text x="650" y="310" fill="#819870" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Café Nespresso &amp; Té</text>

  <!-- Communal Solid Oak Coworking Long Table -->
  <polygon points="60,450 540,450 480,310 120,310" fill="#6B3F28" stroke="#8E4F32" stroke-width="2"/>

  <!-- Coworking Laptops & Desk Planters -->
  <rect x="180" y="330" width="40" height="24" rx="3" fill="#14100E" stroke="#819870" stroke-width="1"/>
  <rect x="290" y="330" width="40" height="24" rx="3" fill="#14100E" stroke="#E07A5F" stroke-width="1"/>
  <rect x="400" y="330" width="40" height="24" rx="3" fill="#14100E" stroke="#D4A373" stroke-width="1"/>

  <!-- Modern Scandinavian Chairs -->
  <g fill="#2B211C" stroke="#D4A373" stroke-width="1.5">
    <rect x="150" y="275" width="45" height="35" rx="6"/>
    <rect x="270" y="275" width="45" height="35" rx="6"/>
    <rect x="380" y="275" width="45" height="35" rx="6"/>

    <rect x="120" y="440" width="55" height="45" rx="8" fill="#181310" stroke="#E07A5F" stroke-width="2"/>
    <rect x="260" y="440" width="55" height="45" rx="8" fill="#181310" stroke="#E07A5F" stroke-width="2"/>
    <rect x="400" y="440" width="55" height="45" rx="8" fill="#181310" stroke="#E07A5F" stroke-width="2"/>
  </g>

  <!-- Warm String / Track Lights -->
  <line x1="80" y1="120" x2="720" y2="120" stroke="rgba(212,163,115,0.4)" stroke-width="1.5"/>
  <circle cx="160" cy="120" r="8" fill="#F4E2D0" filter="drop-shadow(0 0 8px #E9C46A)"/>
  <circle cx="300" cy="120" r="8" fill="#F4E2D0" filter="drop-shadow(0 0 8px #E9C46A)"/>
  <circle cx="440" cy="120" r="8" fill="#F4E2D0" filter="drop-shadow(0 0 8px #E9C46A)"/>
  <circle cx="580" cy="120" r="8" fill="#F4E2D0" filter="drop-shadow(0 0 8px #E9C46A)"/>

  <!-- Badge Overlay -->
  <rect x="580" y="445" width="195" height="35" rx="17" fill="rgba(26,21,18,0.92)" stroke="#D4A373" stroke-width="1.5"/>
  <text x="677" y="468" fill="#F4E2D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🌿 Open Lounge · 25 Pax</text>
</svg>
