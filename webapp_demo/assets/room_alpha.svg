<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="suiteWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1814"/>
      <stop offset="60%" stop-color="#16110E"/>
      <stop offset="100%" stop-color="#0A0807"/>
    </linearGradient>
    <linearGradient id="oakDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A4C32"/>
      <stop offset="100%" stop-color="#482819"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241E1A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4A373" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#241E1A" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#suiteWall)"/>

  <!-- Fluted Wood Accent Wall Panels -->
  <g stroke="rgba(212,163,115,0.12)" stroke-width="4">
    <line x1="50" y1="30" x2="50" y2="400"/>
    <line x1="75" y1="30" x2="75" y2="400"/>
    <line x1="100" y1="30" x2="100" y2="400"/>
    <line x1="125" y1="30" x2="125" y2="400"/>
    <line x1="150" y1="30" x2="150" y2="400"/>
    <line x1="175" y1="30" x2="175" y2="400"/>
    <line x1="200" y1="30" x2="200" y2="400"/>
  </g>

  <!-- Large Window with Soft Daylight -->
  <rect x="250" y="40" width="480" height="220" rx="8" fill="#1A1512" stroke="rgba(224,196,172,0.2)" stroke-width="2"/>
  <rect x="260" y="50" width="460" height="200" fill="#2B221B" opacity="0.4"/>
  <line x1="490" y1="40" x2="490" y2="260" stroke="rgba(212,163,115,0.25)" stroke-width="2"/>

  <!-- Minimalist Executive Shelf & Art -->
  <rect x="80" y="80" width="130" height="160" rx="4" fill="#140F0D" stroke="#D4A373" stroke-width="1.5"/>
  <circle cx="145" cy="140" r="30" fill="#E07A5F" opacity="0.4"/>
  <line x1="100" y1="180" x2="190" y2="180" stroke="#F4E2D0" stroke-width="2"/>

  <!-- Smart PIN Lock on Door Frame -->
  <rect x="730" y="160" width="16" height="50" rx="4" fill="#0D0B09" stroke="#819870" stroke-width="1.5"/>
  <circle cx="738" cy="175" r="3" fill="#819870"/>

  <!-- Executive Oak Desk L-Shape -->
  <polygon points="260,320 660,320 720,440 220,440" fill="url(#oakDesk)" stroke="#8E4F32" stroke-width="2"/>
  <polygon points="120,440 260,320 220,440" fill="#3D2013"/>

  <!-- Curved Monitor & Laptop -->
  <rect x="410" y="270" width="150" height="60" rx="4" fill="#120E0C" stroke="#D4A373" stroke-width="1.5"/>
  <rect x="420" y="276" width="130" height="48" rx="2" fill="#202A36"/>
  <text x="485" y="305" fill="#819870" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SUITE ALPHA · 24/7</text>

  <!-- Ergonomic Leather Chair -->
  <rect x="440" y="360" width="90" height="85" rx="12" fill="#191310" stroke="#E07A5F" stroke-width="2"/>
  <ellipse cx="485" cy="400" rx="35" ry="10" fill="rgba(224,122,95,0.2)"/>

  <!-- Guest Chairs (2x) -->
  <rect x="260" y="260" width="55" height="50" rx="8" fill="#2A1F19" stroke="rgba(212,163,115,0.3)" stroke-width="1.5"/>
  <rect x="620" y="260" width="55" height="50" rx="8" fill="#2A1F19" stroke="rgba(212,163,115,0.3)" stroke-width="1.5"/>

  <!-- Pendant Brass Lamp -->
  <line x1="485" y1="0" x2="485" y2="120" stroke="#D4A373" stroke-width="2"/>
  <polygon points="460,150 510,150 495,120 475,120" fill="#D4A373"/>
  <ellipse cx="485" cy="150" rx="25" ry="8" fill="#F4E2D0" filter="drop-shadow(0 0 10px #E9C46A)"/>

  <!-- Badge Overlay -->
  <rect x="590" y="445" width="185" height="35" rx="17" fill="rgba(26,21,18,0.92)" stroke="#E07A5F" stroke-width="1.5"/>
  <text x="682" y="468" fill="#F4E2D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏢 Suite Privada · 5 Pax</text>
</svg>
