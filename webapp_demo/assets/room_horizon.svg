<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1411"/>
      <stop offset="50%" stop-color="#241B16"/>
      <stop offset="100%" stop-color="#0E0B09"/>
    </linearGradient>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B3A24"/>
      <stop offset="35%" stop-color="#8E4F32"/>
      <stop offset="70%" stop-color="#542E1C"/>
      <stop offset="100%" stop-color="#3B1E12"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F4E2D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4A373" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232B"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9C46A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Room Architecture Background -->
  <rect width="800" height="500" fill="url(#wallGrad)"/>

  <!-- Mountain Horizon Window with Sunset Glow -->
  <rect x="50" y="40" width="700" height="200" rx="8" fill="#181310" stroke="rgba(212,163,115,0.2)" stroke-width="2"/>
  <path d="M 50,190 Q 200,120 380,170 T 750,150 L 750,240 L 50,240 Z" fill="#2D211B" opacity="0.8"/>
  <path d="M 50,160 Q 260,80 480,140 T 750,110 L 750,240 L 50,240 Z" fill="#3D2920" opacity="0.6"/>
  <circle cx="580" cy="90" r="45" fill="#E07A5F" opacity="0.4"/>
  <circle cx="580" cy="90" r="80" fill="url(#lampGlow)" opacity="0.5"/>

  <!-- Window Panes Grid -->
  <line x1="225" y1="40" x2="225" y2="240" stroke="rgba(224,196,172,0.15)" stroke-width="2"/>
  <line x1="400" y1="40" x2="400" y2="240" stroke="rgba(224,196,172,0.15)" stroke-width="2"/>
  <line x1="575" y1="40" x2="575" y2="240" stroke="rgba(224,196,172,0.15)" stroke-width="2"/>

  <!-- Ambient Light Cone -->
  <polygon points="300,0 500,0 650,340 150,340" fill="url(#warmLight)"/>

  <!-- 85" OLED Display Screen on Wall -->
  <rect x="260" y="70" width="280" height="130" rx="6" fill="url(#screenGrad)" stroke="#D4A373" stroke-width="2"/>
  <text x="400" y="130" fill="#F4E2D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3">NEXUS HORIZON · 4K</text>
  <text x="400" y="152" fill="#819870" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Polycom Studio Active · 1Gbps</text>

  <!-- Solid Walnut Boardroom Table (Perspective) -->
  <polygon points="120,440 680,440 590,280 210,280" fill="url(#woodTable)" stroke="#8E4F32" stroke-width="2"/>
  <ellipse cx="400" cy="360" rx="180" ry="12" fill="rgba(244,226,208,0.08)"/>

  <!-- Built-in Connectivity strip & Nespresso -->
  <rect x="330" y="340" width="140" height="12" rx="3" fill="#14100E" stroke="rgba(212,163,115,0.4)" stroke-width="1"/>
  <circle cx="350" cy="346" r="3" fill="#819870"/>
  <circle cx="370" cy="346" r="3" fill="#E07A5F"/>
  <circle cx="430" cy="346" r="3" fill="#D4A373"/>

  <!-- Executive Leather Chairs (Silhouette with Warm Highlights) -->
  <g fill="#2B211C" stroke="rgba(212,163,115,0.3)" stroke-width="1.5">
    <!-- Back chairs -->
    <rect x="230" y="240" width="50" height="42" rx="8"/>
    <rect x="320" y="240" width="50" height="42" rx="8"/>
    <rect x="430" y="240" width="50" height="42" rx="8"/>
    <rect x="520" y="240" width="50" height="42" rx="8"/>

    <!-- Front chairs -->
    <rect x="180" y="420" width="70" height="60" rx="10" fill="#1C1512" stroke="#D4A373" stroke-width="2"/>
    <rect x="310" y="420" width="70" height="60" rx="10" fill="#1C1512" stroke="#D4A373" stroke-width="2"/>
    <rect x="440" y="420" width="70" height="60" rx="10" fill="#1C1512" stroke="#D4A373" stroke-width="2"/>
    <rect x="570" y="420" width="70" height="60" rx="10" fill="#1C1512" stroke="#D4A373" stroke-width="2"/>
  </g>

  <!-- Modern Linear Chandelier -->
  <line x1="280" y1="20" x2="520" y2="20" stroke="#D4A373" stroke-width="4"/>
  <line x1="320" y1="20" x2="320" y2="90" stroke="#D4A373" stroke-width="1.5"/>
  <line x1="480" y1="20" x2="480" y2="90" stroke="#D4A373" stroke-width="1.5"/>
  <rect x="270" y="85" width="260" height="6" rx="3" fill="#F4E2D0" filter="drop-shadow(0 0 12px #E9C46A)"/>

  <!-- Badge Overlay -->
  <rect x="610" y="445" width="165" height="35" rx="17" fill="rgba(26,21,18,0.92)" stroke="#D4A373" stroke-width="1.5"/>
  <text x="692" y="468" fill="#F4E2D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">👑 VIP · 12 Pax</text>
</svg>
